<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas de Nicaragua</title>
<style>
:root{--oro:linear-gradient(110deg,#8a6200 0%,#f5d76e 25%,#fff3b0 40%,#d4a017 55%,#f5d76e 75%,#8a6200 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
body{background:linear-gradient(#0067C6 0 33.3%,#fff 33.3% 66.6%,#0067C6 66.6%) fixed;color:#fff}
.oro{background:var(--oro);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:br 4s linear infinite;font-weight:bold}
@keyframes br{to{background-position:-250% 0}}
.panel{background:rgba(0,40,90,.85);border:2px solid #d4a017;border-radius:18px;padding:26px 20px}
section{display:none;min-height:100vh;padding:24px 14px;flex-direction:column;align-items:center}
section.on{display:flex}
#welcome.on{justify-content:center}
#welcome .panel{max-width:620px;text-align:center}
#welcome h1{font-size:clamp(32px,9vw,58px);margin:12px 0 10px}
#welcome p{font-size:clamp(18px,4.5vw,24px);margin:0 0 22px}
.escudo{width:clamp(150px,42vw,230px);height:clamp(150px,42vw,230px);border-radius:50%;border:4px solid #f5d76e;box-shadow:0 0 25px rgba(245,215,110,.7);background:#fff;object-fit:cover}
button{font-family:inherit;cursor:pointer}
.go{font-size:20px;padding:14px 28px;border-radius:40px;border:2px solid #f5d76e;background:linear-gradient(#1a7fe0,#003f7d);color:#fff;box-shadow:0 0 18px rgba(245,215,110,.6)}
.top{width:100%;max-width:760px;margin-bottom:14px;text-align:center;padding:14px}
.top h2{margin:0;font-size:clamp(26px,7vw,40px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:760px}
.card{border:2px solid #d4a017;border-radius:16px;background:rgba(0,40,90,.9);color:#fff;padding:0;overflow:hidden;text-align:center;font-size:clamp(15px,4vw,20px)}
.card.t{padding:20px 8px}
.card .e{font-size:clamp(34px,10vw,52px);display:block;margin-bottom:6px}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-bottom:2px solid #d4a017;font-size:14px;padding:6px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.card .nom{padding:10px 6px}
.back{margin-top:18px;background:#fff;color:#003f7d;border:2px solid #003f7d;border-radius:30px;padding:10px 22px;font-size:16px}
#modal{position:fixed;inset:0;background:rgba(0,20,50,.85);display:none;justify-content:center;overflow:auto;padding:20px 12px;z-index:9}
#modal.on{display:flex}
.box{background:#0a3a73;border:2px solid #d4a017;border-radius:18px;max-width:700px;width:100%;height:fit-content;padding:22px;position:relative}
.box h3{font-size:clamp(26px,7vw,36px);margin:0 40px 12px 0}
.box .ph{border:2px solid #d4a017;border-radius:12px;margin-bottom:14px;max-height:340px;aspect-ratio:16/10}
.box p{line-height:1.6;font-size:18px;margin:0 0 12px}
.dato{border:2px dashed #f5d76e;border-radius:12px;padding:12px;background:rgba(245,215,110,.12);font-size:17px;line-height:1.5}
.x{position:absolute;top:10px;right:12px;background:none;border:2px solid #f5d76e;color:#f5d76e;border-radius:50%;width:36px;height:36px;font-size:18px}

function mostrarVF(){
 const box=$(VFid);
 if(VFi>=VF.length){box.innerHTML='🎉 ¡Completado! Acertaste '+VFok+' de '+VF.length+'.<br><button class="go" style="margin-top:10px;font-size:16px;padding:8px 18px" onclick="pintarVF({preguntas:VF})">Jugar de nuevo</button>';return}
 const p=VF[VFi];
 box.innerHTML='<div style="font-size:17px;margin-bottom:12px">🎮 Pregunta '+(VFi+1)+' de '+VF.length+': '+(p.frase||'(escribe aquí la frase)')+'</div>'+
  '<button class="go" style="font-size:15px;padding:8px 18px;margin:4px" onclick="responderVF(true)">Verdadero</button>'+
  '<button class="go" style="font-size:15px;padding:8px 18px;margin:4px" onclick="responderVF(false)">Falso</button>'+
  '<div id="vfr" style="margin-top:10px;font-size:16px"></div>'
}
function responderVF(resp){
 const p=VF[VFi];const bien=resp===p.r;if(bien)VFok++;
 $('vfr').textContent=bien?'✅ ¡Correcto!':'❌ Incorrecto.';
 setTimeout(()=>{VFi++;mostrarVF()},900)
}
function abrir(x){$('mt').textContent=x.n;$('mi').innerHTML=foto(x);
 $('mp').textContent=x.info||'✍️ Aquí va la historia o información de '+x.n+'.';
 $('md').textContent=x.dato||'Aquí va el dato curioso.';$('modal').classList.add('on')}
let JL=[],Ji=0,Jok=0,Jt='',JO=[];
function abrirJuego(){$('gt').textContent='🎮 ¿Quieres jugar?';menuJ();$('gm').classList.add('on')}
function cerrarJuego(){$('gm').classList.remove('on')}
function volverJ(){return '<button class="back" onclick="menuJ()">← Elegir otro juego</button>'}
function menuJ(){$('gb').innerHTML='<p>Elige cómo quieres jugar con la '+R.n+':</p><div class="grid"><button class="card t" onclick="jugar(\'quiz\')"><span class="e">❓</span><span class="oro">Preguntas</span></button><button class="card t" onclick="jugar(\'vf\')"><span class="e">✅❌</span><span class="oro">Verdadero o Falso</span></button></div>'}
function jugar(t){const j=R.juego||{};JL=(t==='vf'?j.vf:j.quiz)||[];Jt=t;Ji=0;Jok=0;pregJ()}
function pregJ(){const b=$('gb');
 if(!JL.length){b.innerHTML='<p>Aquí van las preguntas.</p>'+volverJ();return}
 if(Ji>=JL.length){b.innerHTML='<p style="font-size:22px">🎉 ¡Terminaste! Acertaste '+Jok+' de '+JL.length+'.</p><button class="go" onclick="jugar(Jt)">Jugar de nuevo</button>'+volverJ();return}
 const q=JL[Ji];let h='<p>Pregunta '+(Ji+1)+' de '+JL.length+'</p>';
 if(Jt==='vf'){h+='<p style="font-size:21px">'+(q.frase||'(escribe aquí la frase)')+'</p><button class="go" onclick="resVF(true)">Verdadero</button><button class="go" onclick="resVF(false)">Falso</button>'}
 else{JO=(q.op||[]).map((t,i)=>({t:t,ok:i===0})).sort(()=>Math.random()-.5);h+='<p style="font-size:21px">'+(q.p||'(escribe aquí la pregunta)')+'</p>'+JO.map((o,i)=>'<button class="go" onclick="resQ('+i+')">'+o.t+'</button>').join('')}
 b.innerHTML=h+'<div id="jr" style="font-size:19px;margin-top:8px"></div>'}
function resVF(v){fin(v===JL[Ji].r)}
function resQ(i){fin(JO[i].ok)}
function fin(bien){if(bien)Jok++;$('jr').textContent=bien?'✅ ¡Correcto!':'❌ Incorrecto.';document.querySelectorAll('#gb .go').forEach(x=>x.disabled=true);setTimeout(()=>{Ji++;pregJ()},1000)}
function cerrar(){$('modal').classList.remove('on')}
</script>
</body>
</html>
